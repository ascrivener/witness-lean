[package]
name = "lean-check"
description = "Witness check for Lean 4 proofs over content-addressed declarations: attests library batches once, then checks a solver's proof against them"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

# A check has one entry point at pc 0, which is the authorizer layout.
[package.metadata.jam]
type = "authorizer"

[dependencies]
witness-check = { workspace = true, features = ["alloc"] }
polkavm-derive.workspace = true
nanoda_lib = { path = "../vendor/nanoda" }
blake2b_simd = { version = "1.0.5", default-features = false }

[dev-dependencies]
nanoda_lib = { path = "../vendor/nanoda", features = ["testing"] }
witness-types = { workspace = true, features = ["std"] }
