[package]
name = "lean-host"
description = "Runs the Lean check natively on content-addressed nodes, and times it, for sizing batches"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
lean-check = { path = "../../check" }
witness-check.workspace = true
witness-types = { workspace = true, features = ["std"] }
nanoda_lib = { path = "../../vendor/nanoda", features = ["trace"] }
serde_json = "1"
blake2b_simd = "1.0.5"
